<style>
/* Layout: sticky contest tabs over a stack of idea sheets, each sheet is a spec table (label | content) */
:root{--bg:#f3f5f2;--fg:#1c2420;--mute:#5d6a63;--card:#fff;--line:#d5dcd7;--accent:#1f6b52;--accent-soft:#dcece5;--warn:#9a5b12;
--serif:"Noto Serif KR",Georgia,serif;--sans:"Noto Sans KR",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111815;--fg:#e6ece8;--mute:#9aa8a0;--card:#18211d;--line:#2c3933;--accent:#6fd0a9;--accent-soft:#1d3a2f;--warn:#e0a85a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#111815;--fg:#e6ece8;--mute:#9aa8a0;--card:#18211d;--line:#2c3933;--accent:#6fd0a9;--accent-soft:#1d3a2f;--warn:#e0a85a;color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);line-height:1.6;padding-block:24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

h1{font-family:var(--serif);font-size:1.7rem;margin:0 0 4px;text-wrap:balance}

nav{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}

<script>
const L=["문제","구체화","AI 역할","데이터","검증 지표","위험·보완"];
const D={
ss:{name:"사회보장 데이터 AI 혁신",note:"공개 데이터로 시연 가능한 안을 우선했다. 협약 데이터가 필요한 안은 합성 데이터 대체안을 같이 적었다.",items:[
["반납된 보조기기 수리 순번",7.5,"반납 후 점검이 밀려 다음 이용자가 계속 기다린다.","센터가 기종별 대기 인원·수리 예상일을 보고 주간 점검 순서를 바꾼다. 화면은 '이번 주 정비 순서표'와 '장기대기자 경고' 두 개로 한정한다.","고장 유형별 수리시간 추정 + 정비 인력 제약 하의 순서 최적화. 안전 점검은 절대 제약.","중앙보조기기센터 품목 자료(공개), 지역센터 수리대장(협약 전에는 합성 데이터)","대기일 중앙값, 30일 이상 대기자 수. 현행 선착순 순서와 시뮬레이션 비교.","단일 센터 사례에 그칠 수 있음 → 센터 규모 3종으로 시뮬레이션해 일반성 확인."],
["돌봄 인계 달력",7.5,"퇴원일은 정해졌는데 첫 방문돌봄이 늦어 가족이 급히 휴가를 낸다.","퇴원 예정일부터 첫 돌봄일까지 빈 날짜를 달력에 칠하고, 조정 담당자에게 대체 기관을 제시한다. 가장 빠른 날과 보수적인 날을 따로 표시한다.","과거 대기기간의 분위수 예측(P50·P90).","복지로 돌봄사업 안내(공개), 비식별 의뢰·개시일(협약, 불가 시 합성)","예측 구간 포함률, 평균 공백 일수 단축.","실데이터 없이는 검증이 약함 → 합성 분포 가정을 명시하고 민감도 분석 첨부."],
["방학 급식 빈 시간 지도",7.0,"급식카드 가맹점으로 등록돼도 방학 일요일 저녁에는 닫는다.","읍면동별로 시간대마다 걸어서 갈 수 있는 영업점 수를 지도에 표시하고, 공백 지역에 대체 급식 지점을 제안한다.","보행망 최단거리로 도달권 계산. 폐점 확률 모델은 보조 기능으로만 사용.","복지로 아동급식 사업, 지자체 가맹점 목록, 동의받은 영업시간 조사","현장 방문 성공률, 공백 읍면동 수.","영업시간 조사가 수작업 → 시범 1개 시군구로 한정하고 조사 양식을 공개."],
["오늘 열리는 무료급식소",6.5,"주말·임시 휴무에 걸어갔다가 되돌아온다.","담당자가 공지 사진을 한 번 올리면 날짜별 운영표가 전화 음성 안내와 게시판에 같이 반영된다.","OCR로 휴무·대체 배식일 추출. 날짜가 모순되면 관리자 승인 전까지 게시 보류.","지자체 무료급식소 표준데이터, 수행기관 공지","전화 확인 결과와의 일치율, 담당자 입력 시간.","담당자 부담 증가 → 사진 한 장 업로드 외 입력 금지."],
["보완 요청 쉬운말 검사",6.5,"보완 요청을 받은 사람이 무엇을 언제까지 고칠지 모른다.","발송 전 빠진 행동·기한·제출처를 표시하고 쉬운말 초안을 담당자가 승인한다.","언어모델이 세 항목을 추출. 원문과 다른 기한은 규칙으로 차단.","복지로 신청 안내, 지자체 비식별 보완 통지 예문","읽고 다음 행동을 맞힌 비율(원문 대비).","데이터 혁신성이 약함 → 통지문 오류 유형 통계를 함께 제출."]]},
ex:{name:"한국도로공사 AI 활용",note:"관제·휴게소 운영에서 효과를 정량 평가할 수 있는 안을 우선했다.",items:[
["같은 낙하물, 한 번에 모이는 신고",7.5,"신고자마다 표현이 달라 관제원이 같은 낙하물을 반복 확인한다.","노선·방향·시간이 가까운 신고를 지도에서 한 묶음으로 보여주고, 다른 차로 신고는 별도 후보로 남긴다.","문장 임베딩 + 도로망 거리로 묶기. 반대 방향은 병합 차단.","노선 이정, 비식별 신고, 순찰 회수기록(공사 제공 필요)","과거 신고 재생: 잘못 합친 비율, 출동 전 확인 시간.","병합 임계값 민감 → 보수적 임계값과 수동 분리 버튼을 기본으로."],
["마지막 휴게소의 빈 충전기",7.5,"지도에서 비어 있던 충전기가 도착하면 만차다.","직전 분기점에서 두 휴게소의 도착 시점 대기시간 범위를 음성으로 비교해 준다.","충전 상태 전이 + 도착시각으로 대기시간 분위수 예측.","구간속도·휴게소 위치, 환경부 충전기 상태 이력","실제 대기시간 오차(MAE, P90 포함률).","타사 앱과 겹침 → '도착 시점' 예측과 음성 안내를 차별점으로."],
["야간 화물차 연속 주차칸",7.0,"빈 칸이 있어도 긴 차량이 들어갈 연속 공간이 없다.","차량 길이별 진입 가능 구역을 직전 휴게소에서 표시한다.","주차면 분할·점유 인식 후 회전 공간 규칙 적용.","휴게소 도면, 협약 주차 영상(번호판 비저장)","실제 진입 성공률, 헛걸음 횟수.","야간 인식률 저하 → 적외선 영상 샘플로 별도 평가."],
["청각장애인 긴급 통화 카드",7.0,"갓길 고장 신고에서 음성으로 위치·상태를 전하기 어렵다.","정차 후 노선·방향·가까운 표지·필요한 지원을 문자 신고 초안 한 장으로 만든다.","표지 OCR과 도로망 위치 매칭이 다르면 두 후보를 보여주고 사용자가 고른다.","노선·이정 자료, 자체 촬영 표지, 모의 신고","방향 오인율, 작성 시간.","기존 신고 경로와 중복 → 기존 경로에 보내는 초안 생성기로 위치를 정함."],
["터널 방송 전광판 자막",6.5,"터널에 정차한 차 안에서 대피 방송을 알아듣기 어렵다.","관제원이 승인한 방송을 구간별 전광판 문구로 바꾸고 관제실에서 미리 보여준다.","음성인식 후 사전 승인 지시문과 대조. 방향·구간이 다르면 자동 송출 차단.","터널 방송 대본, 전광판 위치, 소방청 대피 안내","모의훈련의 방향 오인 건수, 승인 시간.","안전 직결 → 자동 송출 없이 승인 후 송출만 허용."]]},
hb:{name:"햇반 30주년 AI",note:"30주년 서사가 대부분 비어 있다. 최종 작품에는 1996년 첫 출시부터 현재까지의 흐름을 넣는 것을 권한다.",items:[
["두 끼로 갈라지는 밥",7.5,"소식하는 사람은 한 용기를 열면 남은 밥을 옮겨야 한다.","밀봉된 반달 용기를 떼어 한쪽만 데우는 포스터 한 장. '30년 뒤의 1인 가구' 문구를 헤드라인에 둔다.","단면 스케치 기반 생성 후 밀봉 경계만 부분 수정.","CJ 제품 중량·포장 표시, 식품성분표","미개봉 절반을 관객이 구별하는지 시험.","실제 포장 구조와 충돌 → 상상 시안임을 명시."],
["언어 없이 읽는 조리 띠",7.5,"한국어가 익숙하지 않은 방문객은 작은 글씨에서 출력을 못 찾는다.","출력 선택 → 개봉선 → 시간 순서의 그림 띠를 4:5 이미지로 제작.","생성AI는 사용 장면, 수치·개봉선은 공식 표시 대조 후 사람이 벡터 합성.","해당 제품 표시, 국가표준 그래픽 심볼","처음 보는 이용자의 올바른 출력·시간 선택률.","AI 기여가 작아 보임 → 생성·수정 과정 기록을 전면에 둔다."],
["흔들리지 않는 한 끼 쟁반",7.0,"목발을 짚으면 밥과 반찬을 한 번에 옮기기 어렵다.","외포장이 접혀 그릇을 고정하는 한 손 쟁반이 되는 과정을 3컷으로 보여준다.","종이 모형의 깊이 지도를 조건으로 일관된 제품 컷 생성.","사이즈코리아 손 치수, CJ 용기 크기","찬 모형으로 이동 중 기울어짐 비교.","가열 후 강도 → 가열 전 상태의 쟁반으로 한정."],
["손목으로 여는 햇반",7.0,"손가락 힘이 약하면 필름 귀퉁이를 집기 어렵다.","손목을 넓은 고리에 넣어 뚜껑을 당기는 동작 3컷 캐러셀.","손 자세 조건 이미지 생성, 고리 위치 고정.","포장 사진, 손 치수","동작 이해도 시험.","흔한 방향 → 브랜드 30주년 모티프를 고리 디자인에 넣는다."],
["정전된 밤의 공동 식탁",6.5,"정전된 아파트의 1인 가구는 따뜻한 식사를 어디서 받을지 모른다.","20초 영상: 불 꺼진 창들이 공용 식사 공간으로 이어진다.","같은 건물 스케치를 참조해 장면 생성, 조명 변화로 이동 방향 표현.","행안부 재난 행동요령, 제품 외형","관객이 배식 장소를 설명하는지 확인.","영상 일관성 → 컷 수를 줄이고 정지 이미지 중심으로."]]},
af:{name:"AFPK 영 플래너 챌린지",note:"모든 숫자를 검산했다. 5안이 모두 현금흐름형이라, 최종 제출작에는 위험관리(보험·세금) 한 축을 섞기를 권한다.",items:[
["학기마다 소득이 끊기는 강사",8.0,"강의 달 280만 원, 방학 두 달 80만 원, 생활비 매달 170만 원.","방학 부족액 (170−80)×2=180만 원을 학기 6개월간 월 30만 원씩 적립. 강의 취소 시나리오 비교로 위험 분석까지 확장.","소득 감소 시나리오 생성, 적립 합계·인출 순서는 수식으로 검산.","가상 강의계약, 가계동향조사","방학 종료 잔액, 최저 잔액.","비상예비자금 개념과 연결해 6단계의 '점검'을 강화."],
