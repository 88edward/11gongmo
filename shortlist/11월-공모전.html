<style>
/* Layout: 상단 이름표 + 공모전 탭 + 시간차 전환, 아래로 5장의 아이디어 카드(순위순) */
:root{

@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101512; --surface:#171e1a; --fg:#e8ede9; --muted:#9aa59d; --line:#2a342e; --ink:#e8ede9; --chip:#222c26;
  --a-ss:#52b5ae; --a-hb:#e0a240; --a-af:#85b97f; --a-ex:#e08a68; --s-bg:#e8ede9; --s-fg:#101512; --warn:#e0b45a; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#101512; --surface:#171e1a; --fg:#e8ede9; --muted:#9aa59d; --line:#2a342e; --ink:#e8ede9; --chip:#222c26;
  --a-ss:#52b5ae; --a-hb:#e0a240; --a-af:#85b97f; --a-ex:#e08a68; --s-bg:#e8ede9; --s-fg:#101512; --warn:#e0b45a; color-scheme:dark}
*{box-sizing:border-box}
body{word-break:keep-all;overflow-wrap:break-word;background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.65;
  padding-block:28px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:900px;margin:0 auto;display:flex;flex-direction:column;gap:22px;min-width:0}
h1{font-family:var(--f-display);font-size:clamp(28px,6vw,40px);line-height:1.2;margin:0;letter-spacing:-.01em;text-wrap:balance}
.sub{color:var(--muted);margin:6px 0 0;max-width:62ch}
.bar{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;justify-content:space-between}
.tabs,.seg{display:flex;flex-wrap:wrap;gap:6px}
button{font:inherit;cursor:pointer;color:var(--fg)}
.tab{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:6px;font-weight:500}
.tab[aria-selected=true]{background:var(--c);border-color:var(--c);color:#fff}
:root[data-theme="dark"] .tab[aria-selected=true]{color:#101512}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tab[aria-selected=true]{color:#101512}}
.seg button{border:1px solid var(--line);background:transparent;padding:6px 12px;border-radius:6px;font-size:14px}
.seg button[aria-pressed=true]{background:var(--s-bg);color:var(--s-fg);border-color:var(--s-bg)}
button:focus-visible{outline:2px solid var(--c,var(--ink));outline-offset:2px}
.meta{display:flex;flex-wrap:wrap;gap:6px 20px;color:var(--muted);font-size:13px;font-variant-numeric:tabular-nums}
.meta b{color:var(--fg);font-weight:700}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:18px max(16px,3vw);display:flex;flex-direction:column;gap:12px;min-width:0}
.top{display:flex;gap:12px;align-items:flex-start;justify-content:space-between}
.rk{font-family:var(--f-display);font-size:13px;color:var(--c);font-weight:700;letter-spacing:.04em}
.card h2{font-family:var(--f-display);font-size:19px;line-height:1.35;margin:2px 0 0;text-wrap:balance}
.score{flex:none;text-align:right;font-variant-numeric:tabular-nums}
.score .n{font-size:26px;font-weight:700;line-height:1;color:var(--c)}
.score .g{font-size:12px;color:var(--muted)}
.core{margin:0;font-weight:500}
.bars{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px}
.bar1{font-size:11px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.bar1 i{display:block;height:5px;background:var(--chip);border-radius:3px;overflow:hidden}
.bar1 i u{display:block;height:100%;background:var(--c)}
dl{margin:0;display:grid;grid-template-columns:7.5em minmax(0,1fr);gap:8px 14px}
dt{color:var(--muted);font-size:13px;font-weight:700;padding-top:1px}
dd{margin:0}
.why{font-size:13.5px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px;margin:0}
.why b{color:var(--fg)}
.risk{color:var(--warn)}
.note{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px}
@media (max-width:560px){dl{grid-template-columns:1fr;gap:2px}dt{margin-top:8px}.bars{grid-template-columns:repeat(5,1fr);gap:4px}.bar1{font-size:10px}}
</style>

RAG의 필요성이 약하고 복지로 모의계산·서류안내와 차별이 작다.", "c": "대리 신청하러 갔다가 서류가 모자라 다시 오는 일을 없앤다.", "d": "사업과 신청인 관계(배우자·자녀·이웃 등)를 고르면 본인 서류와 대리인 서류를 분리한 1장 체크리스트를 출력한다. 근거 문장과 출처 링크를 함께 적는다.", "a": "RAG로 공고에서 근거 문장을 찾아 붙이고, 공고에 없는 관계는 추측하지 않고 \"담당 확인\" 상태로 표시한다.", "v": "복지로 사업 안내, 지자체 신청서·위임장 서식. 지표: 담당자 정답 대비 빠진 서류 건수, 재방문율(시범 창구).", "r": "체크리스트로도 가능하다는 비판. 보완: 공고마다 다른 대리 요건 충돌 사례(예: 별도 위임장)를 데이터셋으로 만들어 AI 효과를 수치로 보인다.", "n": "① 5개 사업 대리 요건 수작업 정답표 ② RAG 정확도 측정 ③ 창구 시범 인쇄"}, {"rank": 4, "rd": 2, "i": 4, "title": "오늘 열리는 무료급식소", "t": 73, "g": "A", "s": [18, 17, 13, 16, 9], "why": "공개 표준데이터로 시연 가능하고 헛걸음 방지 효과가 직접적이다. OCR 게시는 기존 지자체 안내와 차별이 약하다.", "c": "주말·임시 휴무에 급식소까지 갔다가 되돌아오는 일을 막는다.", "d": "담당자가 휴무 공지 사진을 한 번 올리면 전화 음성 안내와 인근 게시판의 날짜별 운영표가 같이 갱신된다. 날짜가 모순되면 게시를 보류하고 관리자 승인으로 넘긴다.", "a": "OCR로 휴무·대체 배식일을 추출하고 달력 규칙으로 모순을 검사한다.", "v": "지자체 무료급식소 표준데이터(공개), 수행기관 공지. 지표: 전화 확인 결과와 일치율, 헛걸음 신고 수.", "r": "지자체 안내와 차별이 약하다. 보완: 사진 한 장으로 음성·게시판 동시 갱신하는 운영 절차를 강조한다.", "n": "① 표준데이터로 지도 데모 ② 공지 사진 20장 OCR 평가 ③ 담당자 인터뷰"}, {"rank": 5, "rd": 4, "i": 3, "title": "농촌 마을에 찾아가는 상담일", "t": 72, "g": "A", "s": [18, 17, 15, 11, 11], "why": "교통 취약 농촌 주민의 왕복 시간을 줄이는 이동상담 경로 최적화는 공공성이 높고 AI 역할이 명확하다. 수요 추정 자료가 부족한 점이 약점.", "c": "교통이 불편한 농촌 주민의 상담 이동시간을 줄인다.", "d": "행정복지센터가 이동상담 차량 1대로 돌 수 있는 마을·날짜를 제안하고, 수요가 적은 마을도 최대 방문 간격을 넘지 않게 한다. 경로당에 다음 방문일을 게시한다.", "a": "마을 단위 상담 수요를 추정하고 방문 경로를 최적화한다. 최대 미방문 기간은 하드 제약으로 둔다.", "v": "복지통계, 지자체 버스 시간표·이동상담 집계. 지표: 기존 순회표 대비 주민 왕복 소요시간, 최장 미방문 기간.", "r": "수요 자료 부족. 보완: 1개 군 단위 모의 데이터로 시작하고 현장 담당자와 가중치를 합의한다.", "n": "① 1개 군 데이터 모형화 ② 기존 순회표와 비교 ③ 담당자 검증"}], "hb": [{"rank": 1, "rd": 4, "i": 5, "title": "가족 레시피가 돌아오는 빈 뚜껑", "t": 78, "g": "S", "s": [18, 17, 14, 15, 14], "why": "가족이 채운 반찬 그림이 실제 한 끼로 돌아오는 서사는 정서적이고 30주년의 시간과 가족 의미에 잘 맞는다. 참여자 동의 자료 확보가 쉬워 실행 가능성이 높다.", "c": "자취생이 가족이 채워 준 반찬 그림 한 끼를 받아 보는 25초 영상.", "d": "햇반 외포장 세 칸에 가족이 반찬 그림을 그려 보내면 자취생이 그 재료로 실제 식탁을 차려 사진을 돌려보낸다. 마지막은 두 식탁이 한 화면에 이어지는 컷으로 끝난다.", "a": "가족이 직접 그린 그림을 참조로 반찬이 실제 식탁으로 이어지는 장면을 생성하고, 손글씨는 원본을 합성해 철자를 보존한다.", "v": "농촌진흥청 향토음식 자료, CJ 제품 이미지, 동의받은 자체 레시피. 지표: 시청자가 세 재료와 가족 메시지를 재구성하는 비율.", "r": "그림-식탁 대응이 틀어지는 환각. 보완: 재료 3종을 사전에 확정하고 컷마다 대조한다.", "n": "① 가족 2팀 그림 수집 ② 키프레임 생성 ③ 30초 편집·로고 합성"}, {"rank": 2, "rd": 6, "i": 3, "title": "한글 밥맛 사전", "t": 75, "g": "S", "s": [16, 16, 15, 14, 14], "why": "한국어 학습자에게 식감 단어를 시각화하는 발상은 한류·K-푸드와 연결되고 접사 영상 AI가 자연스럽다. 단어 표기를 사전과 대조해 신뢰성도 확보했다.", "c": "외국어로 설명하기 어려운 밥의 식감을 단어와 영상으로 연결한다.", "d": "서로 다른 두 종류의 미래 햇반을 숟가락으로 들었을 때 밥알이 흩어지거나 붙는 모습을 \"고슬고슬/찰지다\" 단어와 짝지은 4:5 캐러셀 8장.", "a": "실제 접사 영상을 조건으로 질감을 확대 생성하고, 단어 표기는 한국어기초사전과 대조해 합성한다.", "v": "국립국어원 한국어기초사전, 농촌진흥청 쌀 품종 설명, CJ 제품 사진. 지표: 보기 순서를 섞은 단어-질감 연결 정확도.", "r": "실제 제품 식감과 다른 과장. 보완: 모든 이미지에 \"미래 상상\" 표기, 접사는 실촬영 기반.", "n": "① 실접사 영상 촬영 ② 단어 8쌍 확정 ③ 학습자 10명 퀴즈"}, {"rank": 3, "rd": 3, "i": 3, "title": "점자 한 칸 옆의 쌀알", "t": 75, "g": "S", "s": [19, 17, 13, 12, 14], "why": "점자 느낌의 쌀알 패턴은 브랜드 모티프와 접근성을 한 번에 연결하는 독창적 상상이다. 촉각 시험의 참여자 모집·윤리 확인이 필요하다.", "c": "포장 색이 비슷해 헷갈리는 밥 종류를 손끝으로 구분한다.", "d": "쌀밥·잡곡밥 등 3종을 돌출 쌀알 패턴(1·2·3알)으로 구분하는 햇반 테두리를 상상하고, 손이 선반에서 찾아가는 20초 영상을 만든다.", "a": "매크로 참조 사진으로 영상을 생성한 뒤 돌출 패턴의 개수·배치는 합성 레이어로 고정한다.", "v": "국립국어원 점자 자료, CJ 제품 구분. 지표: 익힌 뒤 정확도와 탐색 시간(참여자 동의 촉각 모형).", "r": "점자 표기와 혼동, 시각장애 당사자 의견 부재. 보완: 점자 규정을 따르지 않는 \"쌀알 패턴\"임을 명시하고 당사자 자문을 받는다.", "n": "① 3D프린트 모형 ② 당사자 5인 시험 ③ 20초 영상"}, {"rank": 4, "rd": 5, "i": 4, "title": "마주 보지 않아도 함께 먹는 식탁", "t": 72, "g": "A", "s": [17, 16, 13, 13, 13], "why": "시차를 둔 같은 뚜껑 열기로 떨어진 가족을 잇는 서사가 공감되고 연출 형식이 신선하다. 분할 화면 편집이 핵심이라 AI 비중은 중간.", "c": "떨어져 사는 가족이 하루 시차로 같은 뚜껑을 여는 식탁.", "d": "기숙사 자녀와 부모가 같은 햇반 뚜껑을 여는 동작을 분할 화면으로 잇고, 먼저 먹은 사람이 남긴 한마디를 재생한다.", "a": "같은 구도의 서로 다른 주방을 참조 생성하고 손동작 시점을 맞춰 교차 편집한다.", "v": "통계청 생활시간조사, CJ 제품 사진, 참여자 녹음. 지표: 시청자가 비동기 식사 설정을 이해하는 비율.", "r": "분할 화면 편집 의존으로 AI 비중이 작다. 보완: 두 주방의 일관 생성과 시점 맞춤을 AI 과정으로 문서화.", "n": "① 스토리보드 ② 주방 2종 생성 ③ 편집"}, {"rank": 5, "rd": 1, "i": 1, "title": "손목으로 여는 햇반", "t": 71, "g": "A", "s": [18, 16, 13, 14, 10], "why": "손힘이 약한 사용자를 위한 개봉 동작을 3컷으로 선명하게 보여준다. 접 tle": "재취업 교육을 버틸 수 있는 달수", "t": 72, "g": "A", "s": [17, 15, 14, 15, 11], "why": "전직 교육 기간의 소득 공백을 생활비 내성으로 계산하는 구조가 좋다. 미확정 지원금을 제외하는 보수적 원칙도 적절하다.", "c": "재취업 교육 기간의 소득 공백을 생활비 내성으로 계산한다.", "d": "준비금 800만 원에서 교육비 160만 원과 보전 비상금 100만 원을 빼면 540만 원이고 월 필수비 135만 원이면 4개월을 버틴다. 취업이 2개월 늦어질 때의 부족액을 계산한다.", "a": "언어모델이 교육 공고에서 지원 조건을 추출하고 미확정 지원금은 기본안에서 제외한다.", "v": "고용24 훈련 과정, 통계청 가계동향조사, 가상 지출표.", "r": "지원금 확정 여부. 보완: 확정/미확정 두 시나리오를 분리.", "n": "① 훈련 과정 3종 비교 ② 지연 시나리오 ③ 실행 체크리스트"}, {"rank": 5, "rd": 5, "i": 5, "title": "맞벌이 부부의 비상금은 같은 날 꺼낼 수 있을까", "t": 72, "g": "A", "s": [17, 15, 13, 15, 12], "why": "비상금이 같은 날 꺼낼 수 있는지 유동성 구간으로 보는 접근이 유용하다. 금융상품 약관 해석에 AI와 원문 대조가 어울린다.", "c": "비상금이 있어도 오늘 꺼낼 수 있는 금액은 일부뿐인 문제를 유동성 구간으로 설계한다.", "d": "비상금 450만 원 중 즉시 인출 120만 원, 30일 후 330만 원이면 오늘 필요한 200만 원에 80만 원이 부족하다. 당일·7일·30일 구간별 재배분안을 만든다.", "a": "가상 약관에서 인출 제한과 수수료를 추출하고 원문 대조로 검증한다.", "v": "금융감독원 금융상품 설명자료, 가상 계약서. 지표: 시점별 부족액과 재배분 비용.", "r": "상품 비교 광고 오해. 보완: 특정 상품 추천 없이 구조 설명.", "n": "① 유동성 구간표 ② 재배분안 ③ 점검 주기"}], "ex": [{"rank": 1, "rd": 3, "i": 1, "title": "안개 속 속도 차가 커지는 구간", "t": 80, "g": "S", "s": [19, 19, 17, 11, 14], "why": "안개 구간의 속도 편차로 급감속을 선행 예측하는 접근이 다중 추돌 예방에 직접적이고 AI 가치가 높다. 비교 기준(단순 안개 경보)이 명확하다.", "c": "안개 때 평균속도가 아니라 속도 편차로 급감속을 미리 알린다.", "d": "관제원 화면에 평균속도와 차로별 속도 분산을 함께 보여주고, 가시거리 악화 때 상류 전광판 안내 시점을 제안한다.", "a": "기상과 속도 분포의 변화를 결합해 급감속 군집 발생을 예측하고, 단순 안개 경보와 성능을 비교한다.", "v": "차량검지기·전광판 이력, 기상청 시정관측. 지표: 급감속 전 확보한 선행 시간, 오경보 횟수.", "r": "검지기 데이터 접근. 보완: 공개 교통량 자료로 먼저 검증하고 공사 협약을 병행.", "n": "① 과거 안개 사고 구간 선정 ② 편차 지표 정의 ③ 선행 시간 평가"}, {"rank": 2, "rd": 1, "i": 1, "title": "마지막 휴게소의 빈 충전기", "t": 77, "g": "S", "s": [18, 17, 16, 14, 12], "why": "충전기 대기시간 예측은 전기차 이용자의 실제 불만이고 환경부 충전기 이력으로 시연 가능하다. 휴게소별 도착 시점 예측이라는 설계가 구체적이다.", "c": "운전 중 만차인 충전소를 피하도록 도착 시점 대기시간을 알려 준다.", "d": "직전 분기점에서 두 휴게소의 도착 시점 대기시간 범위를 음성으로 비교한다.", "a": "충전 상태 전이와 예상 도착시각으로 대기시간 분위수를 예측한다.", "v": "구간속도·휴게소 위치, 환경부 충전기 상태 이력. 지표: 실제 대기시간 오차.", "r": "충전기 상태 수집 주기. 보완: 5분 단위 수집으로 시작.", "n": "① 이력 수집
