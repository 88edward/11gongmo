 view.innerHTML=`<div class="intro"><p>${esc(c.desc)}</p><p class="n">${esc(c.note)}</p></div>`+c.items.map((x,k)=>`<details${k===0?" open":""}><summary><span class="sc">${x.score.toFixed(1)}</span><span class="tt">${esc(x.t)}</span><span class="src">출처 ${esc(x.src)}회차-번호</span></summary><div class="body">

D.forEach((c,i)=>{const b=document.createElement("button");b.role="tab";b.textContent=c.name;b.onclick=()=>show(i);tabs.appendChild(b)});
const h=location.hash.slice(1);show(Math.max(0,D.findIndex(c=>c.slug===h)));
</script>
